name: apnbf
description: APNBF - Application commerciale pour artisans et commerçants au Burkina Faso.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
